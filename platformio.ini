; The two environments differ only by which TFT_eSPI User_Setup header is
; -include'd, and by the OTA asset each is allowed to install.
;
; OTA_ASSET_NAME is the single thing standing between a board and a
; wrong-driver flash. Each release carries one .bin per display variant; a
; build will only ever download the asset whose name matches this string
; exactly (src/ota.cpp), because flashing the other variant's image leaves a
; garbled panel that can only be recovered over USB. ota.h #errors if the flag
; is missing, so a new environment cannot silently inherit another's asset.
;
; FIRMWARE_VERSION is deliberately NOT set here. CI stamps it from the release
; tag via PLATFORMIO_BUILD_FLAGS (.github/workflows/build.yml); a local build
; falls back to "dev" (src/ota.h), which never equals a tag and so keeps a
; hand-flashed board honest about not being a released build.

[env:esp32-2432s028r]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bblanchon/ArduinoJson@^6.21.5

build_flags =
  -D USER_SETUP_LOADED=1
  -include include/User_Setup.h
  -D OTA_ASSET_NAME=\"cyd-ham-dashboard-ili9341.bin\"

[env:esp32-2432s028r-st7789]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.partitions = min_spiffs.csv

lib_deps =
  bodmer/TFT_eSPI@^2.5.43
  bblanchon/ArduinoJson@^6.21.5

build_flags =
  -D USER_SETUP_LOADED=1
  -include include/User_Setup_ST7789.h
  -D OTA_ASSET_NAME=\"cyd-ham-dashboard-st7789.bin\"
