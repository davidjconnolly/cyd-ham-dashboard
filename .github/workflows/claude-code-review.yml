name: Claude Code Review

# A LOCAL COPY, deliberately — do not "fix" this into a caller stub.
#
# Every private repo here calls the canonical reviewer in
# davidjconnolly/shared-workflows. A PUBLIC repo cannot call a PRIVATE repo's
# reusable workflow: established empirically on 2026-08-05 with identical stubs
# across five repos — the three private ones resolved and ran, and both public
# ones failed with "This run likely failed because of a workflow file issue".
# claudemon does the same thing for the same reason. See
# https://github.com/davidjconnolly/shared-workflows#access
#
# What this copy forgoes is the shared workflow's `git patch-id` guard, which
# skips re-reviewing a diff that a rebase left unchanged. It exists for
# Dependabot churn; this repo has no dependabot.yml, so it would never fire.

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# NOT optional, and fails silently. This repo's
# default_workflow_permissions is `read`; delete this block and the reviewer is
# capped read-only — the job goes green having posted nothing.
permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write   # the action mints its GitHub token via OIDC

jobs:
  review:
    # Skip PRs whose head branch lives in a fork (external contributors) —
    # they can't read the token secret anyway, and Claude shouldn't auto-run
    # on unreviewed external code in a public repo.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          # Fanned out from hermes-config's sync-claude-token.yml, which holds the
          # single source of truth. Rotation is done there, not here.
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          allowed_bots: "dependabot,hermes-dave,claude-code-dave"
          # 60 turns: re-reviews of multi-commit PRs (read diff + prior threads +
          # post verdict) routinely exhaust a 30-turn cap.
          claude_args: --max-turns 60 --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr review:*)"
          prompt: |
            Review this pull request and leave concise, actionable feedback as
            PR review comments. This is an ESP32 / Arduino firmware project built
            with PlatformIO. It targets the ESP32-2432S028R "Cheap Yellow Display"
            and builds two environments that differ only by which TFT_eSPI
            User_Setup header is -included: esp32-2432s028r (ILI9341) and
            esp32-2432s028r-st7789. Libraries: TFT_eSPI, ArduinoJson v6, and the
            ESP32 Arduino core's WebServer, HTTPClient and Preferences.

            Prioritise:
              - correctness bugs and anything that could crash, hang, reboot-loop,
                or trip the task watchdog on-device
              - memory safety on a device with ~300 KB of usable heap: ArduinoJson
                document capacities, Arduino String lifetimes and fragmentation,
                snprintf/strlcpy sizes, and fixed-size buffers
              - work that blocks the main loop. The dashboard redraws, serves a web
                page, and holds a persistent Telnet DX cluster connection from one
                loop; network reads must be bounded per iteration rather than
                draining a stream to completion
              - anything that breaks either display environment, and TFT drawing
                that overflows the 320x240 panel or leaves stale pixels behind
              - settings persistence: Preferences keys are limited to 15 characters,
                and a setting added to AppSettings must be loaded, saved, and
                normalised
              - once OTA lands: anything that could brick a device mid-flash, and
                any path where one display variant could be flashed with the other
                variant's image
            Skip nitpicks and praise; only flag things worth changing. If the
            diff looks clean, say so briefly.

            Then submit a formal review verdict:
            - If there are NO blocking issues (nothing that must be fixed before
              merge — style nits and optional suggestions don't block), approve:
              gh pr review ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --approve --body "<one-line summary of why it's mergeable>"
            - If there ARE blocking issues, do NOT approve. Your comments stand as
              the verdict and the required-review check stays unsatisfied until a
              clean revision is pushed.
